# Обновления зависимостей. FOUNDATION.md §10.
#
# ⚠ ТОЛЬКО действия GitHub, и это не полумера, а следствие правил проекта.
#
# Почему действия — да. 2026-08-06 раннер начал предупреждать, что `actions/checkout@v4`
# и `astral-sh/setup-uv@v5` собраны под Node.js 20 и запускаются на Node.js 24
# принудительно. Предупреждение висело в каждом прогоне, и заметить его можно было только
# глазами, открыв журнал. Dependabot приносит такое запросом на слияние.
#
# Почему Python — НЕТ. §10.1 требует пинить жёстко («polars быстро меняет API, и агент,
# помнящий старую версию, изобретёт несуществующий метод»), а §10 делает новую боевую
# зависимость решением владельца. Автоматические запросы на подъём `ccxt==4.5.70` или
# `polars==1.43.2` воевали бы с обоими правилами: каждый такой запрос — предложение
# сменить референт, а не почистить хвост.
#
# Уязвимости в Python-зависимостях при этом НЕ игнорируются, но ⚠ ПОПРАВКА 2026-08-10:
# прежняя редакция этой строки утверждала, что их закрывают «автоматические исправления
# безопасности Dependabot». Это НЕВЕРНО, и проверено в тот же день на живом случае.
#
# Dependabot умеет по нашему проекту ровно половину работы:
#   * АЛЕРТЫ — да. Граф зависимостей GitHub читает `uv.lock` (SBOM отдаёт все 67
#     пакетов), и четыре уязвимости 2026-08-10 пришли именно оттуда;
#   * ИСПРАВЛЕНИЯ — НЕТ. `uv` в списке экосистем Dependabot отсутствует
#     (docs.github.com, «Supported ecosystems and repositories»: pip, pipenv,
#     pip-compile, poetry — и всё). Запрос на слияние с подъёмом версии он не создаст
#     никогда, хотя настройка репозитория `dependabot_security_updates` показывает
#     «включено».
#
# То есть включённая настройка НИЧЕГО НЕ ДЕЛАЛА, и выглядело это как защита. Дыру
# закрывает собственный шаг CI (`pip-audit` от PyPA, ubuntu-задание в ci.yml): он падает
# по коду возврата на любой известной уязвимости, а не присылает запрос. Контроль
# фальсифицируемости для него проведён на замке до правки — 4 уязвимости и код 1.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Раз в месяц, а не еженедельно: действий два, и меняются они редко. Еженедельный
    # шум учит закрывать запросы не читая — ровно то, чего проект избегает в гейтах.
    open-pull-requests-limit: 3
    commit-message:
      prefix: "CI"

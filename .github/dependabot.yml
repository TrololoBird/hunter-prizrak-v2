# Обновления зависимостей. FOUNDATION.md §10.
#
# ⚠ ТОЛЬКО действия GitHub, и это не полумера, а следствие правил проекта.
#
# Почему действия — да. 2026-08-06 раннер начал предупреждать, что `actions/checkout@v4`
# и `astral-sh/setup-uv@v5` собраны под Node.js 20 и запускаются на Node.js 24
# принудительно. Предупреждение висело в каждом прогоне, и заметить его можно было только
# глазами, открыв журнал. Dependabot приносит такое запросом на слияние.
#
# Почему Python — НЕТ. §10.1 требует пинить жёстко («polars быстро меняет API, и агент,
# помнящий старую версию, изобретёт несуществующий метод»), а §10 делает новую боевую
# зависимость решением владельца. Автоматические запросы на подъём `ccxt==4.5.70` или
# `polars==1.43.2` воевали бы с обоими правилами: каждый такой запрос — предложение
# сменить референт, а не почистить хвост.
#
# Уязвимости в Python-зависимостях при этом НЕ игнорируются: алерты Dependabot и
# автоматические исправления безопасности включены на самом репозитории. Разница
# существенная — там повод внешний и названный (CVE), здесь поводом был бы просто выход
# новой версии.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Раз в месяц, а не еженедельно: действий два, и меняются они редко. Еженедельный
    # шум учит закрывать запросы не читая — ровно то, чего проект избегает в гейтах.
    open-pull-requests-limit: 3
    commit-message:
      prefix: "CI"

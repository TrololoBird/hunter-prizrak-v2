name: Дефект
description: Число, которое не воспроизводится; ноль, который не может быть иным; молчаливый отказ
labels: ["дефект"]
body:
  - type: markdown
    attributes:
      value: |
        Проект держится на одном правиле: **число не докладывается, пока не проверено,
        что оно могло быть другим**. Поэтому в отчёте важнее не «что не работает», а
        **чем это меряется**.
  - type: textarea
    id: what
    attributes:
      label: Что напечаталось
      description: Дословный вывод — команда и её ответ, а не пересказ.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Чем оказалось (или чем должно быть)
      description: |
        Если известно — что на самом деле. Если нет, напишите, каким замером это
        различается: какой вход обязан дать ДРУГОЙ ответ.
    validations:
      required: true
  - type: input
    id: repro
    attributes:
      label: Команда воспроизведения
      description: §7.3 — число без команды не фиксируется. Если команды нет, так и напишите.
    validations:
      required: true
  - type: input
    id: fingerprint
    attributes:
      label: Отпечаток данных
      description: |
        Для замеров по растущему кэшу — состав данных на момент замера (файлов суток,
        сигналов, прогонов). Без него число воспроизводится лишь до первой доливки.

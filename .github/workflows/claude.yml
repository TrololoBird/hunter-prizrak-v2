name: Claude

# Claude Code внутри GitHub: отвечает на «@claude» в задачах и обсуждениях запросов
# на слияние. Заведено 2026-08-10 по указанию владельца («полное соединение с Claude
# Code»).
#
# ⚠ ЧТО ЭТО МЕНЯЕТ ПО СРАВНЕНИЮ С РАБОТОЙ В ТЕРМИНАЛЕ. Здесь у Claude НЕТ живой биржи
# (раннеры GitHub получают от Binance HTTP 451 — замер 2026-08-03, записан в ci.yml),
# нет боевого леджера и нет кэша сделок. Значит из четырёх способов проверки проекта
# ему доступен ровно один — ГЕЙТЫ. Живые прогоны и замеры остаются на машине владельца,
# и это ограничение названо здесь, чтобы ответ «я проверил» не читался шире, чем есть.
#
# ⚠ ЧЕМ ДЕЙСТВИЕ АВТОРИЗУЕТСЯ. Способа два, и для владельца этого проекта верен ВТОРОЙ.
#
#   1. `ANTHROPIC_API_KEY` — ключ из Claude Console. Это ОТДЕЛЬНАЯ оплата по токенам
#      (pay-as-you-go); подписка Claude Max её НЕ включает, то есть при наличии Max
#      этот путь означал бы платить дважды.
#   2. `CLAUDE_CODE_OAUTH_TOKEN` — токен ПОДПИСКИ (Pro, Max, Team, Enterprise).
#      Порождается локально командой `claude setup-token` и привязан к подписке того,
#      кто её выполнил.
#
# Поставить (делает владелец, в своём терминале — токены и ключи ввожу не я):
#   claude setup-token          # выдаст токен
#   gh secret set CLAUDE_CODE_OAUTH_TOKEN
#
# Оба входа переданы действию ниже: непустой и будет использован. Пока не задан ни
# один, шаг СНИМАЕТСЯ по `env.HAS_AUTH` — задание не краснеет на каждом комментарии.
# Постоянно красная работа учит не смотреть на CI (то же правило в ci.yml про живой
# прогон), а `secrets` в условии САМОГО ЗАДАНИЯ недоступен — отсюда проверка через
# `env` на шаге, а не `if` на задании.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Права шире, чем у ci.yml, и это не небрежность: чтобы отвечать в задаче и запросе,
# нужно право писать в них. `contents: read` — Claude здесь ЧИТАЕТ дерево и НЕ пушит:
# ветку он создать не сможет, и это осознанная граница на первое время.
permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    # Три условия, и все нужны:
    #   * секрет заведён — иначе задание бессмысленно;
    #   * упомянут «@claude» — иначе отвечали бы на каждый комментарий;
    #   * автор — владелец репозитория. Репозиторий ПУБЛИЧНЫЙ с 2026-08-10, то есть
    #     комментарий может написать кто угодно, а задание тратит ключ владельца.
    if: |
      github.event.repository.owner.login == github.actor
      && (contains(github.event.comment.body, '@claude')
          || contains(github.event.issue.body, '@claude')
          || contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # `secrets` в `jobs.<id>.if` недоступен, а в `env` задания — доступен. Отсюда
      # признак, по которому шаг ниже снимается, пока авторизации нет.
      HAS_AUTH: ${{ (secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Гейты — единственная проверка, доступная Claude на раннере (см. шапку файла),
      # поэтому окружение готовится заранее: иначе он потратит ходы на установку.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --group gates

      # ⚠ Закреплено ХЕШЕМ, а не тегом `@v1` — то же решение владельца 2026-08-07
      # (находка zizmor `unpinned-uses`): тег подвижен, хеш нет. Версия в комментарии,
      # чтобы Dependabot обновлял хеш вместе с ней.
      - uses: anthropics/claude-code-action@bd4488507006939d8b3b7f098a2231b36e22f8c1  # v1
        if: env.HAS_AUTH == 'true'
        env:
          # Все гейты печатают по-русски, а раннер отдаёт вывод в cp1252 —
          # без этого первый же гейт падает UnicodeEncodeError (замер 2026-08-06).
          PYTHONIOENCODING: utf-8
        with:
          # Токен подписки — основной путь; ключ Console оставлен как запасной.
          # Пустой вход действие игнорирует, поэтому переданы оба.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          claude_args: --max-turns 30

      - name: 'сказать, чего не хватает'
        if: env.HAS_AUTH != 'true'
        run: |
          echo "Claude не запущен: нет ни CLAUDE_CODE_OAUTH_TOKEN, ни ANTHROPIC_API_KEY."
          echo "Для подписки Max: claude setup-token, затем gh secret set CLAUDE_CODE_OAUTH_TOKEN"

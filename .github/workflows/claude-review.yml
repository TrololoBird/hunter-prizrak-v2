name: Claude review

# Разбор запроса на слияние ПО ПРАВИЛАМ ЭТОГО ПРОЕКТА, а не «на общие проблемы».
# Заведено 2026-08-10.
#
# ⚠ ПОЧЕМУ ПРОМПТ ТАКОЙ ДЛИННЫЙ И ИМЕННО ТАКОЙ. Готовый пример из документации
# действия предлагает «Review this PR for security issues and code quality». Для этого
# проекта такой разбор почти бесполезен: код здесь ломается не инъекциями, а
# ЗАМЕРАМИ, которые не могли ответить иначе, числами без референта и цитатами, которые
# при сверке оказываются пересказом. Реестр таких случаев ведётся в CLAUDE.md, и
# каждая строка в нём — то, что уже один раз проехало мимо человека.
#
# Гейты ловят форму (21 проверка в ci.yml). Этот разбор ищет то, чего гейт поймать не
# может: правдоподобное объяснение вместо разбора, ноль с красивой причиной, замер,
# у которого нет контроля.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # Запросы из чужих ответвлений секретов не получают (правило GitHub), поэтому
    # проверка на автора здесь лишняя — задание просто снимется без ключа.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Владелец на подписке Max: основной путь — токен подписки
      # (`claude setup-token`), а не ключ Console, который оплачивается отдельно.
      HAS_AUTH: ${{ (secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --group gates

      - uses: anthropics/claude-code-action@bd4488507006939d8b3b7f098a2231b36e22f8c1  # v1
        if: env.HAS_AUTH == 'true'
        env:
          PYTHONIOENCODING: utf-8
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: "true"
          claude_args: --max-turns 25
          prompt: |
            Разбери этот запрос на слияние по правилам проекта. Отвечай ПО-РУССКИ.

            Прочитай сначала CLAUDE.md — там правила работы. Код, докстроки и сам
            FOUNDATION.md источником требований НЕ являются: FOUNDATION порождён ИИ
            ровно так же, как код, и с 2026-08-12 он не канон, а протокол решений —
            ссылаться на его § можно как на АДРЕС записи, но не как на ОСНОВАНИЕ.
            Источники: (1) мини-курс целиком, текст И рисунки — ЧТО рисовать;
            (2) корпус разборов docs/audit/ — чего в курсе нет; (3) классический
            технический анализ, научные статьи, проверенные проекты, 3–5 надёжных
            источников на элемент — ВЕРНО ЛИ посчитано; (4) исходник и живой ответ
            ccxt — как устроен транспорт.

            Ищи прежде всего вот это, по убыванию важности:

            1. ЧИСЛО БЕЗ РЕФЕРЕНТА. Появилась константа, порог, доля, множитель — есть
               ли рядом источник (страница курса, внешняя публикация) или ЗАМЕР с
               командой воспроизведения? «Подобрано» допустимо, но обязано быть названо
               этим словом.

            2. ЗАМЕР БЕЗ КОНТРОЛЯ ФАЛЬСИФИЦИРУЕМОСТИ. Если в диффе есть новое число —
               показано ли, что прибор СПОСОБЕН выдать другой ответ? Для «совпало N из
               M» обязателен второй контроль: тот же замер на данных, про которые
               заведомо известно, что совпадать они не должны. Ноль с красивой причиной
               опаснее всего: он не выглядит дефектом.

            3. ОТКАЗЫ БЕЗ СВОДКИ ПО ИЗМЕРЕНИЮ. Один отказ — данные, сто отказов на одном
               таймфрейме — дефект. Если правка добавляет ветку отказа, есть ли счётчик
               и разрез, вдоль которого возможен перекос?

            4. МОЛЧАЛИВАЯ ДЕГРАДАЦИЯ. Пустой результат, подставленное значение, тихий
               except, «0» вместо NotReady с названной причиной (§4.3).

            5. СТАТИСТИКА БЕЗ ЗНАМЕНАТЕЛЯ. Доля, среднее, winrate — сказано ли, по какой
               ПОДВЫБОРКЕ считалось? 2026-08-10 нашлось, что средний R считался по трети
               журнала, и это выглядело нормально.

            6. ЦИТАТА, КОТОРАЯ НЕ ЦИТАТА. Текст в «ёлочках» рядом со «стр. N» обязан
               быть ДОСЛОВНЫМ текстом страницы. Пересказ и надписи с рисунков — обычные
               кавычки. Гейт course_citations это проверяет, но только там, где ссылка
               оформлена узнаваемо.

            7. ИЗМЕНЕНИЕ РАСЧЁТА БЕЗ ДВУХ КАРТОЧЕК. Тронут расчёт — предъявлены ли ДВЕ
               КАРТОЧКИ, до и после, на СВЕЖИХ данных? Дифф повтора по СТАРЫМ кадрам
               для этого не годится и с 2026-08-19 не требуется: он показывает разницу
               двух версий кода на мёртвом рынке. `replay --diff` спрашивай только про
               ДЕТЕРМИНИЗМ карточки.

            8. НОВЫЙ ГЕЙТ. Новый файл в gates/ — САМА ПО СЕБЕ находка: писать новые
               гейты запрещено приказом владельца 2026-08-19, без исключений. Починка
               уже стоящего гейта до охвата, который он себе приписывает, — законна.

            Что ты можешь проверить прямо здесь, а что нет — скажи вслух. На раннере нет
            живой биржи (Binance отдаёт HTTP 451), нет боевого леджера и нет кэша
            сделок: доступны только гейты. Прогони их и приложи вывод:

                bash scripts/check.sh

            Формат ответа: сначала НАХОДКИ (каждая — файл, строка, в чём именно
            нарушение правила и какого), потом СОМНЕНИЯ (то, что похоже на нарушение, но
            ты не уверен — скажи, чем это проверяется), потом что проверить НЕ УДАЛОСЬ и
            почему. Если находок нет — так и напиши, не выдумывай замечаний ради объёма.

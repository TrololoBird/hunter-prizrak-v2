name: CI

# FOUNDATION.md §7.4: гейт работает в CI постоянно. §7.5: тестов нет,
# верификация — гейты и живые прогоны.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # ⚠ Версии подняты 2026-08-06: прежние (checkout@v4, setup-uv@v5) собраны под
      # Node.js 20, и раннер уже принудительно запускал их на Node.js 24, предупреждая об
      # этом в каждом прогоне. Обе новые версии объявляют `using: node24` — проверено
      # чтением их `action.yml` по тегу, а не по документации.
      - uses: actions/checkout@v7
      # ⚠ Версия пиньется ТОЧНО, и это не педантизм: с v8 проект перестал публиковать
      # плавающие мажорные теги (в v8.0.0 удалён `update-major-minor-tags`), то есть
      # `@v9` не существует и `@v9.0.0` — единственная рабочая форма. Проверено:
      # `git/matching-refs/tags/v9` отдаёт только `v9.0.0`.
      #
      # Что изменилось по дороге с v5 и нас касается:
      #   v6 — другой `cache-dependency-glob` по умолчанию (влияет на ключ кэша, не на
      #        результат); отсутствие `UV_CACHE_DIR` по умолчанию — только на своих
      #        раннерах, здесь `ubuntu-latest`;
      #   v9 — `prune-cache` по умолчанию стал `false`: кэш растёт, зато меньше нагрузка
      #        на PyPI. Умолчание оставлено авторское, своего решения тут нет.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # группа gates — независимый оракул индикаторов (§10.3)
      - run: uv sync --frozen --group gates

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      - name: 'гейт: никакого молчания (§4.3)'
        run: uv run python gates/no_silent_failure.py

      - name: 'гейт: только публичные данные (§1, §5)'
        run: uv run python gates/public_data_only.py

      - name: 'гейт: словари между слоями запрещены (§10.1)'
        run: uv run python gates/no_loose_dicts.py

      - name: 'гейт: чистота расчёта (§10.3)'
        run: uv run python gates/purity.py

      - name: 'гейт: единственный писатель в боевую базу (§10.2)'
        run: uv run python gates/production_writer.py

      - name: 'гейт: индикаторы против независимого оракула (§10.3)'
        run: uv run python gates/indicator_oracle.py

      - name: 'гейт: комплектность источников, минимум 3 (§0.1)'
        run: uv run python gates/sources.py

      - name: 'гейт: все величины против опубликованных формул (§0)'
        run: uv run python gates/formula_reference.py

      - name: 'гейт: с какого бара величина определена (§4.3)'
        run: uv run python gates/indicator_availability.py

      - name: 'гейт: смоук-импорт всех модулей'
        run: uv run python gates/smoke_import.py

      # ⚠ ПОВЕДЕНЧЕСКИЕ гейты — они исполняют расчёт и сравнивают числа, а не форму.
      # До 2026-08-04 таких было два (оракулы индикаторов), и внешний разбор показал,
      # что именно поэтому дефекты расчёта жили до него: их нечем было поймать.
      - name: 'гейт: обе ветви бинирования дают один бин (§5)'
        run: uv run python gates/binning_agrees.py

      - name: 'гейт: правила курса на рядах с известным ответом (§2)'
        run: uv run python gates/course_rules.py

      # ⚠ Четыре шага ниже добавлены 2026-08-04. Три первых гейта существовали с
      # 2026-08-03, но в CI ВПИСАНЫ НЕ БЫЛИ и потому ни разу не отработали на чужой
      # машине: гейт вне CI — это скрипт, который помнят, пока помнят. Нашлось при
      # сверке списка `gates/*.py` со списком шагов, а не гейтом: за самим CI
      # автоматической проверки полноты нет, и это остаётся дырой.
      - name: 'гейт: модели запрещают лишние поля (§10.1)'
        run: uv run python gates/models_forbid_extra.py

      - name: 'гейт: ссылки в документах ведут на существующее (§0)'
        run: uv run python gates/doc_refs.py

      - name: 'гейт: у каждого числа есть команда воспроизведения (§7.3)'
        run: uv run python gates/repro_commands.py

      - name: 'гейт: цитаты курса дословны (§0)'
        run: uv run python gates/course_citations.py

      # Добавлен 2026-08-06 вместе со службой 24/7 (А-1). Проверяет условие, отказ по
      # которому полностью бесшумен: `await` внутри снятия снимка не роняет ничего, он
      # лишь превращает срез одного момента в смесь двух.
      - name: 'гейт: неделимые участки не ждут (§4.3)'
        run: uv run python gates/atomic_sections.py

      - name: 'гейт: каждый гейт вызывается в CI'
        run: uv run python gates/ci_covers_gates.py

      - name: 'гейт: вселенная читается (§5)'
        run: |
          uv run python -c "from hunter.config import load_universe as l; u=l(); print('вселенная: символов', len(u.symbols), 'ТФ', len(u.timeframes))"

      - name: 'гейт: схема леджера и read-only (§10.2, §10.6)'
        run: |
          uv run python -m hunter ledger --init
          uv run python -m hunter ledger

# ЖИВОЙ ПРОГОН В CI НЕВОЗМОЖЕН, и это замер, а не предположение.
# Прогон 2026-08-03 на раннере GitHub: Binance ответил HTTP 451
#   "Service unavailable from a restricted location according to 'b. Eligibility'"
# То есть §7.5 «верификация — гейты в CI и живые прогоны» здесь расщепляется:
# гейты живут в CI, живые прогоны — только на машине владельца.
#   uv run python -m hunter run --seconds 400 --seed-limit 500
# Держать в CI постоянно красную работу нельзя: она обучает не смотреть на CI.

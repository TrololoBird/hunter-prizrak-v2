# Доставка. НЕ вселенная и НЕ расчёт: здесь только то, кому и когда бот рассказывает.
#
# Вселенная (config/universe.toml) — файл, по которому воспроизводится расчёт (§5, §10.6).
# Список публикуемых монет к расчёту отношения не имеет и потому лежит отдельно: правка
# здесь не меняет ни одного числа в карточке.
#
# Секреты СЮДА НЕ КЛАДУТСЯ. Токен бота и адрес канала — переменные окружения
# TELEGRAM_BOT_TOKEN и TELEGRAM_CHANNEL_ID: этот файл лежит в git, они — нет.

[bot]

# ЗАКРЕПЛЁННЫЕ МОНЕТЫ: их карта уходит в канал сама, по закрытию бара publish_timeframe.
#
# СОСТАВ РАСШИРЕН 2026-08-21 по приказу владельца: «вначале запинь необходимые монеты».
# Повод — его же вопрос в тот день: «почему приходили скриншоты в тг только по 3-4
# символам если вселенная 25?». Ответ: список публикации и вселенная — РАЗНЫЕ списки, и
# первый застыл 2026-08-17 на четырёх монетах, когда служба реально прошла по девяти
# символам. Вселенную владелец расширил до 25 назавтра, 2026-08-18; список публикации за
# ней не пошёл, и заметить это было нечем (см. предупреждение внизу).
#
# ЧТО ЗНАЧИТ «НЕОБХОДИМЫЕ». Обязательный состав владелец назвал 2026-08-18 дословно:
# «самое главное чтобы были btc, eth, sol, sui, ondo, xau, xag, xaut» — восемь монет. Из
# них публиковались ДВЕ, BTC и ETH; SOL, SUI, ONDO, XAU, XAG, XAUT не уходили в канал ни
# разу за трое суток. Они и добавлены — это и есть «необходимые».
#
# BCH И POL ОСТАВЛЕНЫ, хотя владелец их не называл: под ними настоящий замер 2026-08-17
# по трём независимым выборкам (корпус из 14 видео, RSS канала, 53 идеи на TradingView),
# и автор посвятил им самые длинные разборы одной монеты — BCH 57 минут, POL 37.
# Протокол и команды воспроизведения: docs/audit/pinned-coins-2026-08-17.md
# Выкинуть их — решение владельца, а не моё: замер не отозван.
#
# ⚠ ЦЕНА СПИСКА СЧИТАЕТСЯ ЗДЕСЬ, а не обнаруживается в канале. На монету уходит
# MESSAGES_PER_ANSWER = 2 сообщения (график 4ч + сводка), предел Telegram —
# Pacer.PER_MINUTE = 20 сообщений в минуту в один чат. Десять монет дают ровно 20:
# публикация укладывается в минуту и НЕ растягивается. Одиннадцатая монета уже
# растягивает, и `publish_pinned` предупредит об этом в логе до отправки.
#
# ⚠ ОСТАЛЬНЫЕ 15 СИМВОЛОВ ВСЕЛЕННОЙ СЧИТАЮТСЯ, НО НЕ ПУБЛИКУЮТСЯ. Это две сущности под
# одним человеческим смыслом «монеты, которые смотрит бот», и знаменателя, который бы
# показал расхождение, в проекте НЕТ: `publish_pinned` печатает «всего=10», а не «10 из
# 25». Ровно поэтому расхождение прожило трое суток и нашёл его владелец глазами.
# Разбирается вместе со сканером рынка (приказ владельца 2026-08-21).
pinned = [
  # обязательные владельца, приказ 2026-08-18
  "BTC/USDT:USDT", "ETH/USDT:USDT", "SOL/USDT:USDT", "SUI/USDT:USDT",
  "ONDO/USDT:USDT", "XAU/USDT:USDT", "XAG/USDT:USDT", "XAUT/USDT:USDT",
  # по замеру корпуса 2026-08-17 — самые длинные разборы одной монеты у автора
  "BCH/USDT:USDT", "POL/USDT:USDT",
]

# К закрытию какого бара привязана публикация. 4ч — старший из трёх графиков бота
# (tgbot.CHART_TFS): между его закрытиями старшая картина не меняется.
# Публикация идёт не в сам момент закрытия, а через такт службы после него — иначе в
# канал ушла бы карта, посчитанная до нового бара (tgbot.PUBLISH_DELAY_S).
publish_timeframe = "4h"

# Пауза между запросами ОДНОГО пользователя, секунд.
# Выведена из документированного лимита Telegram: «In a group, bots are not be able to
# send more than 20 messages per minute» (core.telegram.org/bots/faq). Ответ бота — четыре
# сообщения, значит ёмкость группы 5 ответов в минуту; минута на пользователя означает,
# что один человек не занимает больше пятой части этой ёмкости.
answer_cooldown_s = 60

# Сколько монет ВНЕ вселенной может ждать сборки одновременно.
# Сборка идёт по одной (лимит веса биржи считается на весь IP), и цена её ЗАМЕРЕНА:
# холодная монета на боевом горизонте 180 суток — 345 с (LTC, 2026-08-17, протокол
# docs/audit/tgbot-channel-2026-08-17.md). Значит очередь из восьми — это до 45 минут
# ожидания у последнего в ней; длиннее держать значит обещать ответ, которого не дождутся.
# Переполнение — названный отказ, а не молчаливо выброшенный запрос.
build_queue_max = 8

# Сколько построенная ПО ЗАПРОСУ карта считается свежей, минут. ⚠ Это размен, не замер.
# Строго по §2.8 карта стареет за 5 минут (младший ТФ), и служба так и считает. Но
# пересобирать монету вне вселенной каждые 5 минут — сотни запросов к бирже на каждую;
# 30 минут это цена слежения «по требованию», и бот называет её в самом ответе.
map_ttl_minutes = 30

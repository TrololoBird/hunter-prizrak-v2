# Доставка. НЕ вселенная и НЕ расчёт: здесь только то, кому и когда бот рассказывает.
#
# Вселенная (config/universe.toml) — файл, по которому воспроизводится расчёт (§5, §10.6).
# Список публикуемых монет к расчёту отношения не имеет и потому лежит отдельно: правка
# здесь не меняет ни одного числа в карточке.
#
# Секреты СЮДА НЕ КЛАДУТСЯ. Токен бота и адрес канала — переменные окружения
# TELEGRAM_BOT_TOKEN и TELEGRAM_CHANNEL_ID: этот файл лежит в git, они — нет.

[bot]

# ЗАКРЕПЛЁННЫЕ МОНЕТЫ: их карта уходит в канал сама, по закрытию бара publish_timeframe.
#
# СОСТАВ ВЫВЕДЕН ЗАМЕРОМ 2026-08-17 по поручению владельца («найди монеты самостоятельно»).
# Протокол и команды воспроизведения: docs/audit/pinned-coins-2026-08-17.md
#
# Считалось, о чём автор говорит, по ТРЁМ независимым выборкам: корпус из 14 видео в
# репозитории (июль 2026), RSS канала Prizrak_Trade (15 последних видео, 13-16 августа),
# 53 идеи на ru.tradingview.com/ideas/prizraktrade. Всего 75 тикеров.
#
# Правило отбора — ДВА условия, и оба проверяемы:
#   1. автор посвятил монете ОТДЕЛЬНЫЙ длинный разбор либо возвращается к ней постоянно
#      (BTC — 5 из 15 последних видео канала; ETH — 3 видео корпуса; BCH — 57 минут,
#      самый длинный разбор одной монеты в корпусе; POL — 37 минут);
#   2. у монеты ЕСТЬ карта в леджере — иначе публикация раз в 4 часа печатала бы отказ.
#      Замер: карта есть у 11 символов, активных зон BTC 69, ETH 47, BCH 25, POL 23.
#
# ⚠ Что этот замер НЕ говорит: остальные 23 символа вселенной карты не имеют вовсе —
# служба гонялась по первым девяти. Расширять список можно ПОСЛЕ прогона службы по всей
# вселенной, а не до него.
pinned = ["BTC/USDT:USDT", "ETH/USDT:USDT", "BCH/USDT:USDT", "POL/USDT:USDT"]

# К закрытию какого бара привязана публикация. 4ч — старший из трёх графиков бота
# (tgbot.CHART_TFS): между его закрытиями старшая картина не меняется.
# Публикация идёт не в сам момент закрытия, а через такт службы после него — иначе в
# канал ушла бы карта, посчитанная до нового бара (tgbot.PUBLISH_DELAY_S).
publish_timeframe = "4h"

# Пауза между запросами ОДНОГО пользователя, секунд.
# Выведена из документированного лимита Telegram: «In a group, bots are not be able to
# send more than 20 messages per minute» (core.telegram.org/bots/faq). Ответ бота — четыре
# сообщения, значит ёмкость группы 5 ответов в минуту; минута на пользователя означает,
# что один человек не занимает больше пятой части этой ёмкости.
answer_cooldown_s = 60

# Сколько монет ВНЕ вселенной может ждать сборки одновременно.
# Сборка идёт по одной (лимит веса биржи считается на весь IP), и цена её ЗАМЕРЕНА:
# холодная монета на боевом горизонте 180 суток — 345 с (LTC, 2026-08-17, протокол
# docs/audit/tgbot-channel-2026-08-17.md). Значит очередь из восьми — это до 45 минут
# ожидания у последнего в ней; длиннее держать значит обещать ответ, которого не дождутся.
# Переполнение — названный отказ, а не молчаливо выброшенный запрос.
build_queue_max = 8

# Сколько построенная ПО ЗАПРОСУ карта считается свежей, минут. ⚠ Это размен, не замер.
# Строго по §2.8 карта стареет за 5 минут (младший ТФ), и служба так и считает. Но
# пересобирать монету вне вселенной каждые 5 минут — сотни запросов к бирже на каждую;
# 30 минут это цена слежения «по требованию», и бот называет её в самом ответе.
map_ttl_minutes = 30

# Вселенная. FOUNDATION.md §5: «закреплённый набор символов, задаваемый оператором».
# Замер (биржевое время): 2026-08-03T16:41:30Z. Не пересчитывается автоматически.
# Протокол и команда воспроизведения: docs/audit/universe-2026-08-03.md
#
# Правило отбора: символы корпуса ∪ топ-12 по обороту, только крипто-бессрочные.
# «Не-крипто» — по механическому признаку биржи (underlyingType/contractType),
# а не подбором тикеров; PAXG назван явно, потому что признаком не отсекается.
#
# Состав подтверждён владельцем 2026-08-03 (вариант B, см. ниже).

[universe]
timeframes = ["5m", "15m", "1h", "4h", "1d", "1w"]  # §2.8

# ГЛУБИНА ХРАНЕНИЯ — в барах на таймфрейм, не в календаре (указание владельца
# 2026-08-03). Календарная постановка порождала оценку «сотни мегабайт за год»;
# в барах вопрос исчезает: для 5м это 1000 строк вместо 105 120 за год.
# Состав: самое длинное требование величины (ema200 = 200 баров) + рабочее окно
# профиля объёма.
# Календарный эквивалент 1000 баров: 5м 3.5 сут · 15м 10.4 сут · 1ч 41.7 сут ·
# 4ч 166.7 сут · 1Д 2.7 года · 1Н 19.2 года (больше, чем существует).
#
# ⚠ ПОПРАВКА 2026-08-11. Здесь стояло «1000 — ещё и предел одного запроса ccxt»,
# и как ОБОСНОВАНИЕ это неверно: предел библиотеки — не требование методики. Хуже
# того, он тихо ограничивал карту: горизонт 180 суток на 5м, 15м и 1ч НЕ ДОСТИГАЛСЯ
# вовсе, потому что ряд обрывался на 3.5 / 10.4 / 41.7 сутках, и отказа при этом не
# возникало — ряд просто был короче.
# Транспорт предел снял: `exchange._fetch_ohlcv_paged` ходит курсором по времени,
# проверено зондом probe_ohlcv_paging_2026-08-11.py (3000 баров, три контроля, в том
# числе совпадение хвоста с независимым запросом бар в бар).
# Само ЧИСЛО не поднято: 1000 по-прежнему покрывает единственное заявленное
# требование (ema200 = 200 баров) с запасом, а глубже — это размен веса биржи на
# число структур, и его цена не замерена. Запрос 1000 свечей стоит 5 веса, значит
# 180 суток на 5м — 52 страницы, 260 веса на символ и ТФ.
bars_per_timeframe = 1000

# ПЛОЩАДКА Binance: binanceusdm (бессрочные на USDT), binance (спот),
# binancecoinm (монетное обеспечение). До 2026-08-11 класс биржи был зашит в код
# константой — то есть выбора не существовало. Символы обязаны соответствовать
# площадке: BTC/USDT — спот, BTC/USDT:USDT — бессрочный, это РАЗНЫЕ рынки с разной
# ценой и разным объёмом. Проверено на всех трёх: probe_venues_2026-08-11.py
venue = "binanceusdm"

# ДОПУСК (§4.3, hunter/admission.py). Порог — самое длинное требование среди
# величин §2.9. Замер 2026-08-03 (`uv run python -m hunter admission`):
# проходят 16 из 27; у ВСЕХ 11 непрошедших недостаёт ровно ema200 на 1Н,
# остальные величины (atr14, rsi14, macd) доступны везде.
# РЕШЕНИЕ ВЛАДЕЛЬЦА 2026-08-03 — ВАРИАНТ B: вселенная остаётся 27 символов.
# ema200 на 1Н отдаётся как NotReady там, где истории не хватает, и это ВИДНО
# оператору (§4.3), а не исчезает молча. Обоснование владельца: вариант A
# выбрасывал бы семь символов корпуса — единственный внешний эталон для приёмки
# этапа 3. Выбрасывать эталон ради недостающего доп-фактора — плохой размен.
# Порог здесь — справочный: он НЕ исключает символы, а задаёт, с какого объёма
# истории величина считается. Что именно недоступно, печатает `hunter check`.
admission_required_bars = 200


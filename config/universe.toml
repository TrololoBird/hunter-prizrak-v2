# ⚠⚠ СВЕРКА 2026-08-17 (сомнение владельца в этой строке ПОДТВЕРДИЛОСЬ ЗАМЕРОМ).
# «Топ-12 по обороту» — снимок ОДНОГО ДНЯ, и он не держится: через 14 суток в топ-12
# осталось 4 из 10 отобранных им символов. BLESS ушёл на 93 место, 1000RATS — на 169
# (оборот 4,1 млн против ~200 млн, нужных для входа в топ-12 сегодня). То есть шесть
# символов из 27 стоят во вселенной по всплеску оборота одного дня.
# Состав при этом ЖИВОЙ: все 27 существуют, торгуются и являются крипто-бессрочными
# с расчётом в USDT — проверено сегодня, ноль исключений.
# Протокол и команда воспроизведения: docs/audit/frozen-rules-2026-08-17.md
#
# Правило отбора: символы корпуса ∪ топ-12 по обороту, только крипто-бессрочные.
# «Не-крипто» — по механическому признаку биржи (underlyingType/contractType),
# а не подбором тикеров; PAXG назван явно, потому что признаком не отсекается.
#
# Состав подтверждён владельцем 2026-08-03 (вариант B, см. ниже).

[universe]
timeframes = ["5m", "15m", "1h", "4h", "1d", "1w"]  # §2.8

# РАЗРЕШЕНИЕ, ИЗ КОТОРОГО СТРОИТСЯ ПРОФИЛЬ ОБЪЁМА. Не таймфрейм анализа.
#
# Появился 2026-08-12 вместе с переводом профиля со сделок aggTrade на свечи (решение
# владельца). Прежний источник держался на одной фразе в скобках из первого коммита
# проекта; обзор двадцати чужих проектов показал, что сигнальные боты жанра отдельных
# сделок не берут вовсе, а TradingView — инструмент автора курса — строит профиль
# «using data from lower timeframes for the same symbol», то есть по минутным барам.
#
# Значение — цена приближения: объём свечи раскладывается по её диапазону РАВНОМЕРНО,
# и чем младше свеча, тем меньше ошибка допущения. 1m — самое младшее, что отдаёт биржа.
# Допустимые значения перечисляет bars.PROFILE_MS; таймфреймы анализа сюда не годятся.
#
# Цена вопроса замерена: сутки BTC через aggTrades — 3500 единиц веса, через минутные
# свечи — 6. Разбор: docs/audit/poc-candles-vs-ticks-2026-08-12.md
profile_timeframe = "1m"

# ⚠ КЛЮЧ `bars_per_timeframe` УДАЛЁН 2026-08-11, И ВОТ ПОЧЕМУ ЭТО ВАЖНО ЗНАТЬ.
# Он стоял здесь с длинным обоснованием глубины — и НЕ ЧИТАЛСЯ НИЧЕМ: ни `config.py`,
# ни любым другим местом проекта. На него при этом ссылались две докстроки как на
# действующую величину. Настоящую глубину всё это время задавал `--seed-limit` с
# умолчанием 500, то есть вдвое меньше заявленного здесь.
#
# Теперь глубина не задаётся числом вообще. Она ВЫВОДИТСЯ из горизонта отдельно по
# каждому ТФ (`run.seed_depth` → `bars.bars_needed`), потому что одна цифра на все ТФ
# делала карту несопоставимой самой с собой: 500 баров это 1.7 суток на 5м и 9.6 года
# на 1Н, а горизонт применялся к обоим как к равным.
# Нижняя граница — admission.seed_floor(): строжайшее среди величин, которые система
# СЧИТАЕТ, это ema200 с 200 барами. ⚠ Правка 2026-08-11 писала здесь «adx14 с 304» —
# отозвано 2026-08-17: adx14 не считается нигде в src (строка справочная, для оракула
# CI), а §2.9 ADX не называет. Прежний комментарий про ema200 был ВЕРЕН.
# `--seed-limit` больше нуля по-прежнему перекрывает вывод: это ручка оператора.

# ПЛОЩАДКА Binance: binanceusdm (бессрочные на USDT), binance (спот),
# binancecoinm (монетное обеспечение). До 2026-08-11 класс биржи был зашит в код
# константой — то есть выбора не существовало. Символы обязаны соответствовать
# площадке: BTC/USDT — спот, BTC/USDT:USDT — бессрочный, это РАЗНЫЕ рынки с разной
# ценой и разным объёмом. Проверено на всех трёх: probe_venues_2026-08-11.py
venue = "binanceusdm"

# ⚠ КЛЮЧ `admission_required_bars = 200` УДАЛЁН 2026-08-17. ЭТО ВТОРОЙ СЛУЧАЙ ТОГО ЖЕ
# ДЕФЕКТА, что и `bars_per_timeframe` (удалён 2026-08-11), и найден он тем же способом —
# механическим обходом, а не чтением: ключ НЕ ЧИТАЛСЯ НИ ОДНОЙ строкой `src`, `gates` или
# `scripts` (замер: 0 вхождений против 140 у `symbols`).
#
# Хуже, чем мёртвый ключ: он ПРОТИВОРЕЧИЛ собственному объяснению. Комментарий говорил
# «порог — самое длинное требование среди величин §2.9», а стояло 200 — требование ema200.
# ⚠ Поправка 2026-08-17 (вечер): прежняя редакция этого абзаца называла «настоящим»
# порогом 304 (adx14) — это был тот же перекос: 304 относится к справочной величине,
# которую система не считает, а по §2.9 порог как раз 200. Число ключа было верным,
# дефектом была его мёртвость.
# То есть файл называл порогом число, которое не порог, и не использовалось ничем.
#
# РЕШЕНИЕ ВЛАДЕЛЬЦА 2026-08-03 — ВАРИАНТ B сохраняется и от удаления ключа не зависит:

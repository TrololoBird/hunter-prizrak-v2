# доIPOшные 2 (ANTHROPIC, OPENAI). То есть ЧЕТВЕРТЬ ДОСКИ — не крипта. Владельцу это
# названо в тот же день; XAU и XAG он заказывал сам, остальное пришло со словом «вся».
#
# ⚠ ПОЧЕМУ У ДОСКИ ЛЕСТНИЦА КОРОЧЕ — арифметика, а не вкус. При горизонте 180 суток
# 5м даёт 51 840 баров на символ, 15м — 17 280; вдвоём это 92.3% лестницы. Полная

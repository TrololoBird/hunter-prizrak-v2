[project]
name = "hunter"
version = "0.1.0"
description = "Сигнально-аналитическая система по методологии PrizrakTrade"
# FOUNDATION.md §10.2: 3.12, а не свежайшая — максимум готовых колёс.
requires-python = ">=3.12,<3.13"
dependencies = [
    # §10.1: транспорт. Документация ccxt — внешний референт, самописный WS-клиент — нет.
    # ⚠ 4.5.70 → 4.5.71 (2026-08-10) — ради БЕЗОПАСНОСТИ, а не ради новых возможностей.
    # 4.5.70 пришпиливала `aiohttp==3.14.1` и `cryptography==49.0.0` ТОЧНЫМИ пинами, и
    # обновить их отдельно было нельзя. Dependabot на этих версиях держал 4 открытых
    # уязвимости, из них две высокие: чтение за границей кучи в C-парсере HTTP-ответов
    # aiohttp (ровно наш путь — мы разбираем ответы биржи) и Bleichenbacher-оракул в
    # cryptography. 4.5.71 сменила пины на диапазоны (`aiohttp<3.15,>=3.14`,
    # `cryptography<51,>=49`), что и открыло обновление.
    "ccxt==4.5.71",
    # §10.1: «Пинить жёстко: polars быстро меняет API, и агент, помнящий старую
    # версию, изобретёт несуществующий метод».
    "polars==1.43.2",
    # §10.2: «Индикаторы: не писать свои».
    "polars-talib==0.1.4",
    # §10.1: контракты между слоями. Словари между слоями запрещены.
    "pydantic==2.13.4",
    # §10.1
    "structlog==26.1.0",
    "aiogram==3.30.0",
    # §10.1: доставка. Решение владельца 2026-08-10: бот отдаёт СКРИНШОТЫ карты уровней
    # в стилистике обзоров автора — рендер серверный, без экрана (backend Agg).
    "matplotlib==3.10.7",
    # §10.1: горячий цикл профиля объёма (profile_source.CandleWindows.window) переведён
    # на numpy 2026-08-18 по приказу владельца «делай пункты 1 и 2»: сборка карты BTC
    # шла минуты, 43% времени — раскладка объёма по бинам. До этого numpy стоял в venv
    # ТРАНЗИТИВНО (за matplotlib) — боевой импорт транзитивной зависимости был бы молчаливой
    # зависимостью от чужого решения, поэтому пин явный. Версия — та, что уже стояла.
    "numpy==2.2.6",
]

[dependency-groups]
dev = ["ruff>=0.14", "mypy>=1.18"]
# §10.3: «Отдельная зависимость только для гейтов, не для продакшена».
# ⚠ pandas-ta по умолчанию делегирует в TA-Lib, если тот установлен (замер 2026-08-03:
# ATR совпал побитово; с talib=False разошёлся на 1.5e-11). Оракул ОБЯЗАН звать
# pandas-ta с talib=False, иначе он сверяет TA-Lib сам с собой и не проверяет ничего.
gates = ["pandas-ta==0.4.71b0", "ta-lib==0.7.1", "pandas>=2.2", "pymupdf>=1.28.0"]
tools = [
    "pymupdf>=1.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hunter"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "gates"]
# ⚠ Здесь стояло обоснование через docs/audit/probes/ — «исходники зондов, сохранённые
# как есть ради воспроизводимости». Каталог УДАЛЁН 2026-08-19 приказом владельца, и
# обоснование вместе с ним: зонд в репозиторий не кладётся, замер живёт в переписке.
# `docs` остаётся вне линтера по другой причине — там проза и примеры кода в разметке,
# а не исполняемый пакет.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "TID", "RUF"]
# RUF001-003 ловят кириллицу как «неоднозначный символ» — правило против подмены
# латиницы гомоглифами. Язык документации проекта русский, поэтому на нём оно даёт
# только шум: замер 2026-08-03 — 67 срабатываний из 77, все на русском тексте.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# FOUNDATION.md §6: «любое сравнение «сейчас против биржевой метки» использует
# скорректированное время». §10.3: «Время входит как аргумент, а не берётся внутри».
# Исключение — построчный noqa с причиной; пофайловых исключений нет умышленно.
# Проверено пробником из 5 форм записи: поймано 5 из 5.
"time.time".msg = "Часы только через hunter.clock.now_ms() — FOUNDATION.md §6, §10.3."
"time.time_ns".msg = "Часы только через hunter.clock.now_ms() — FOUNDATION.md §6, §10.3."
"datetime.datetime.now".msg = "Часы только через hunter.clock.now_ms() — FOUNDATION.md §6, §10.3."
"datetime.datetime.utcnow".msg = "Часы только через hunter.clock.now_ms() — FOUNDATION.md §6, §10.3."
# §10.4: «LLM в конвейере расчёта… Никакой случайности».
"random".msg = "Случайность запрещена — FOUNDATION.md §10.3 (детерминированный повтор)."
# §10.4: ORM не добавляется; §10.2: SQLite напрямую, чтобы владелец мог читать SQL.
"pandas".msg = "pandas только в гейтах-оракулах — FOUNDATION.md §10.3."

[tool.mypy]
python_version = "3.12"
strict = true
# ⚠ `scripts/` и `gates/` добавлены 2026-08-04. До этого проверялся ТОЛЬКО `hunter`, а
# числа всех протоколов производит `scripts/probes.py` — то есть инструмент измерения
# стоял вне гейта, который ловит «поля не существует». Именно mypy поймал молчаливое
# проглатывание `bodies=bodies` в src (docs/audit/falsifiability-2026-08-04.md); в
# scripts такое не поймал бы никто. Первый же прогон с расширенным охватом нашёл в
# `gates/no_loose_dicts.py` ветку, которая упала бы с AttributeError.
#
# ⚠ 2026-08-19: `scripts` и `docs/audit/probes` УБРАНЫ из охвата вместе с самими
# зондами — владелец остановил их плодение («зонды которые сгенерировал сам ИИ
# чтобы проверять код который сгенерировал ИИ это иллюзия»). Проверяется то, что
# идёт в работу: боевой пакет и гейты.

files = ["src/hunter", "gates"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Стабов нет. Точечно, не глобально: глобальный ignore_missing_imports скрывает
# удаление собственного модуля.
module = ["ccxt.*", "polars_talib.*", "pandas_ta.*", "talib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pandas — только в гейте-оракуле (§10.3 разрешает его там и запрещает в hunter/).
# Стабы pandas-stubs не ставятся умышленно: они тянут зависимость ради одного файла,
# который сравнивает наши индикаторы с чужой библиотекой и типами не пользуется.
module = ["pandas.*", "fitz.*"]
ignore_missing_imports = true

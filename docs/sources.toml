# ---------------------------------------------------------------- ATR (Уайлдер)

[[element]]
name = "atr14"
what = "Average True Range, период 14: определение TR, затравка, сглаживание"

[[element.source]]
url = "https://en.wikipedia.org/wiki/Average_true_range"
tier = 4
date = "2026-08-03"
fetched = "пересказ"
quote = "TR = max[(high − low), abs(high − close_prev), abs(low − close_prev)]; ATR_t = (ATR_{t-1} × (n-1) + TR_t) / n"

[[element.source]]
url = "https://chartschool.stockcharts.com/table-of-contents/technical-indicators-and-overlays/technical-indicators/average-true-range-atr"
tier = 4
date = "2026-08-03"
fetched = "пересказ"
quote = "The first 14-day ATR is the average of the daily TR values for the last 14 days. Current ATR = [(Prior ATR x 13) + Current TR] / 14"

[[element.source]]
url = "https://help.tc2000.com/m/69445/l/755843-average-true-range-atr"
tier = 3
date = "2026-08-03"
fetched = "пересказ"
quote = "the largest of the: most recent period's high minus low; abs(high − previous close); abs(low − previous close). Wilder's smoothing via exponential average requires period = ((period * 2) - 1)"

[[element.source]]
url = "gates/formula_reference.py"
tier = 1
date = "2026-08-03"
fetched = "замер"
quote = "скалярная реализация формулы против polars_talib: расхождение 0.000e+00 на 485 точках, включая затравку"

# ---------------------------------------------------------------- RSI (Уайлдер)

[[element]]
name = "rsi14"
what = "Relative Strength Index, период 14: RS, затравка, сглаживание Уайлдера"

[[element.source]]
url = "https://en.wikipedia.org/wiki/Relative_strength_index"
tier = 4
date = "2026-08-03"
fetched = "пересказ"
quote = "RS = SMMA(U,n) / SMMA(D,n); RSI = 100 - 100/(1+RS); newval = (prevval * (n - 1) + newdata) / n"

[[element.source]]
url = "https://chartschool.stockcharts.com/table-of-contents/technical-indicators-and-overlays/technical-indicators/relative-strength-index-rsi"
tier = 4
date = "2026-08-03"
fetched = "пересказ"
quote = "First Average Gain = Sum of Gains over the past 14 periods / 14. Average Gain = [(previous Average Gain) x 13 + current Gain] / 14"

[[element.source]]
url = "https://help.tc2000.com/m/69404/l/747071-rsi-wilder-s-rsi"
tier = 3
date = "2026-08-03"
fetched = "пересказ"
quote = "RSI = 100 - (100 / (1+RS)); Wilder's smoothing = Previous MA value + (1/n periods * (Close - Previous MA))"

[[element.source]]
url = "gates/formula_reference.py"
tier = 1
date = "2026-08-03"
fetched = "замер"
quote = "скалярная реализация против polars_talib: расхождение 4.324e-16 на 485 точках"

# ---------------------------------------------------------------- EMA

[[element]]
name = "ema200"
what = "Экспоненциальная скользящая: множитель, рекурсия, затравка"

[[element.source]]
url = "https://en.wikipedia.org/wiki/Exponential_smoothing"
tier = 4
date = "2026-08-03"
fetched = "пересказ"
quote = "s_t = alpha*x_t + (1-alpha)*s_{t-1}; alpha = 2/(k+1) where k is the number of past data points of the moving average"

[[element.source]]
url = "https://chartschool.stockcharts.com/table-of-contents/technical-indicators-and-overlays/technical-overlays/moving-averages-simple-and-exponential"
tier = 4
date = "2026-08-03"
fetched = "пересказ"
quote = "Multiplier: (2 / (Time periods + 1)); EMA: {Close - EMA(previous day)} x multiplier + EMA(previous day); a simple moving average is used as the previous period's EMA in the first calculation"

[[element.source]]
url = "gates/formula_reference.py"
tier = 1
date = "2026-08-03"
fetched = "замер"
quote = "скалярная реализация против polars_talib: расхождение 4.315e-15 на 300 точках"


# ---------------------------------------------------------------- ADX

[[element]]
name = "adx14"
what = "ADX 14: +DM/-DM, +DI/-DI, DX, сглаживание. §2.9 его НЕ называет — не используется"

[[element.source]]
url = "https://en.wikipedia.org/wiki/Average_directional_movement_index"
tier = 4
date = "2026-08-03"
fetched = "пересказ"
quote = "UpMove = today's high − yesterday's high; if UpMove > DownMove and UpMove > 0, then +DM = UpMove, else +DM = 0; ADX = 100 times the smoothed moving average of the absolute value of (+DI − -DI) divided by (+DI + -DI)"

[[element.source]]
url = "https://chartschool.stockcharts.com/table-of-contents/technical-indicators-and-overlays/technical-indicators/average-directional-index-adx"
tier = 4
date = "2026-08-03"
fetched = "пересказ"
quote = "The first ADX value is simply a 14-day average of DX; ((Prior ADX14 x 13) + Current DX Value)/14; smoothing: Prior TR14 - (Prior TR14/14) + Current TR1"

[[element.source]]
url = "https://www.tradingview.com/support/solutions/43000502250-average-directional-index-adx/"
tier = 3
date = "2026-08-03"
fetched = "пересказ"
quote = "Current High - Previous High = UpMove; ADX = 100 times the Exponential Moving Average of the Absolute Value of (+DI - -DI) / (+DI + -DI); default 14"

